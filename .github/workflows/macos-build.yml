name: macos-build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: macos
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7
    - name: Configure Homebrew curl (downloads using HTTP/2 fail due to nginx CVE mitigation)
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/curl-http1" <<'EOF'
        #!/bin/bash
        echo "curl wrapper invoked: $*" >&2
        exec /usr/bin/curl "$@" --http1.1
        EOF
        chmod +x "$RUNNER_TEMP/curl-http1"
        echo "HOMEBREW_CURL_PATH=$RUNNER_TEMP/curl-http1" >> "$GITHUB_ENV"
    - name: install dependencies
      run: |
        brew install autoconf automake ghostscript imagemagick inkscape libtool
        echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"
    - name: install XeTeX
      run: |
        brew install --cask basictex
        echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
        export PATH="/Library/TeX/texbin:$PATH"
        sudo tlmgr update --self
        sudo tlmgr install fontspec geometry
    - name: prepare lambdanative
      run: |
        mkdir -p "$HOME/Library/Caches/lambdanative"
        cp SETUP.template SETUP
        cp PROFILE.template PROFILE
    - name: build DemoConsole for macOS (to build the toolchain)
      run: |
        ./configure DemoConsole verbose
        sh make.sh all
    - name: smoke test all apps
      run: |
        sh make.sh smoke | tee "$RUNNER_TEMP/lambdanative-smoke.log"
        grep -q 'SMOKED .* apps of which 0 failed' "$RUNNER_TEMP/lambdanative-smoke.log"
