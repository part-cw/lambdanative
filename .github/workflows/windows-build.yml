name: windows-build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: windows
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Show Windows version
      run: systeminfo

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: true
        install: >-
          autoconf
          automake
          make
          cmake
          m4
          libtool
          zip
          git
          patch
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-imagemagick
          mingw-w64-x86_64-ghostscript
          mingw-w64-x86_64-inkscape

    - name: Cache Chocolatey downloads
      uses: actions/cache@v4
      with:
        path: C:\Users\runneradmin\AppData\Local\Temp\chocolatey
        key: ${{ runner.os }}-choco-${{ hashFiles('.github/workflows/windows-build.yml') }}
        restore-keys: |
          ${{ runner.os }}-choco-

    - name: Get MSYS2 cache path
      id: msys2-cache
      shell: msys2 {0}
      run: echo "dir=$(cygpath -w "$HOME/.cache/lambdanative/packages")" >> "$GITHUB_OUTPUT"

    - name: Cache LambdaNative packages
      uses: actions/cache@v4
      with:
        path: ${{ steps.msys2-cache.outputs.dir }}
        key: lambdanative-packages-${{ hashFiles('libraries/**/make.sh', 'SETUP.template') }}
        restore-keys: |
          lambdanative-packages-

    - name: Install dependencies
      shell: pwsh
      run: |
        choco install -y --no-progress autohotkey tinytex

    - name: Prepare lambdanative
      shell: msys2 {0}
      run: |
        ln -sf /mingw64/bin/gs.exe /mingw64/bin/gswin32.exe
        mkdir -p "$HOME/.cache/lambdanative"
        cp SETUP.template SETUP
        cp PROFILE.template PROFILE

    - name: Build DemoConsole
      shell: msys2 {0}
      run: |
        ./configure DemoConsole verbose
        sh make.sh all

    - name: Smoke test all apps
      shell: msys2 {0}
      run: |
        sh make.sh smoke | tee "$RUNNER_TEMP/lambdanative-smoke.log"
        grep -q 'SMOKED .* apps of which 0 failed' "$RUNNER_TEMP/lambdanative-smoke.log"
