name: fedora-build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: fedora
    runs-on: ubuntu-latest
    container:
      image: fedora:43

    steps:
    - uses: actions/checkout@v7
    - run: cat /etc/os-release
    - name: install dependencies
      run: |
        dnf -y install alsa-lib-devel ant autoconf automake bc cmake curl
        dnf -y install gambit-c gcc14 gcc14-c++ ghostscript git grep inkscape
        dnf -y install ImageMagick-devel java-25-openjdk-devel libtool
        dnf -y install libXext-devel make mesa-libGL-devel mesa-libGLU-devel
        dnf -y install netpbm-devel patch perl-FindBin poppler-utils portaudio
        dnf -y install procps-ng python3-sdkmanager sed tar tcl-devel texlive
        dnf -y install texlive-ps2eps tree xorg-x11-server-Xvfb wget which zip
    - name: prepare lambdanative
      run : |
       # Make directory to avoid errors during build
       mkdir -p /github/home/.cache/lambdanative
       cp SETUP.template SETUP
       cp PROFILE.template PROFILE
       # Use older compiler until
       # https://github.com/part-cw/lambdanative/issues/492
       # is resolved
       sed -i 's|SYS_CC="gcc $SYS|SYS_CC="gcc-14 $SYS|g' targets/linux/host_linux
       sed -i 's|SYS_CXX="g++ $SYS|SYS_CXX="g++-14 $SYS|g' targets/linux/host_linux
    - name: build DemoConsole
      run: |
       ./configure DemoConsole
       sh make.sh all
    - name: smoke tests
      run: |
       sh make.sh smoke
